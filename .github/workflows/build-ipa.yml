name: Build iOS IPA (ARM64 Real Device)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-15 # Chạy trên macOS 15 Sequoia Apple Silicon (M1/M2/M3)
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Kiểm tra & Chọn Xcode có iOS SDK
        run: |
          if xcrun --show-sdk-path --sdk iphoneos >/dev/null 2>&1; then
            echo "Default Xcode already has iOS SDK: $(xcodebuild -version | head -n 1)"
          else
            for xcode in /Applications/Xcode*.app; do
              if DEVELOPER_DIR="$xcode/Contents/Developer" xcrun --show-sdk-path --sdk iphoneos >/dev/null 2>&1; then
                echo "Switching to Xcode with iOS SDK: $xcode"
                sudo xcode-select -s "$xcode/Contents/Developer"
                break
              fi
            done
          fi
          xcodebuild -version
          echo "iOS SDK Path: $(xcrun --show-sdk-path --sdk iphoneos)"

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Cài đặt Dependencies
        run: npm install

      - name: Patch ExpoModulesJSI cho kiến trúc iOS & Swift 6.0
        run: python3 patch_package.py

      - name: Xuất dự án Native iOS (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Cài đặt CocoaPods
        run: |
          cd ios
          pod install

      - name: Biên dịch ARM64 cho iPhone thật (Không cần tài khoản $99)
        run: |
          WORKSPACE_PATH=$(ls -d ios/*.xcworkspace | head -n 1)
          WORKSPACE_NAME=$(basename "$WORKSPACE_PATH")
          SCHEME_NAME="${WORKSPACE_NAME%.xcworkspace}"
          echo "Compiling $WORKSPACE_NAME with scheme $SCHEME_NAME..."
          xcodebuild -workspace "$WORKSPACE_PATH" \
                     -scheme "$SCHEME_NAME" \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -archivePath "ios/App.xcarchive" \
                     archive \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_IDENTITY=""

      - name: Đóng gói thành file NotifyGlass_Device.ipa
        run: |
          mkdir -p build_output/Payload
          APP_PATH=$(find ios/App.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -n 1)
          echo "Found app bundle at: $APP_PATH"
          cp -R "$APP_PATH" build_output/Payload/
          cd build_output
          zip -r -9 NotifyGlass_Device.ipa Payload
          ls -lh NotifyGlass_Device.ipa

      - name: Xuất file IPA qua Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotifyGlass_RealDevice_IPA
          path: build_output/NotifyGlass_Device.ipa
          retention-days: 7

      - name: Tạo GitHub Release (Tải trực tiếp file .ipa)
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: release-${{ github.run_number }}
          name: "NotifyGlass v1.0 (Build ${{ github.run_number }})"
          body: "Tệp tin NotifyGlass_Device.ipa biên dịch chuẩn kiến trúc ARM64 iOS thật (không phải simulator), sẵn sàng cài đặt qua AltStore / Sideloadly / TrollStore / Scarlet."
          files: build_output/NotifyGlass_Device.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
